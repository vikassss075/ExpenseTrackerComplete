<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 720px;">
        <h2 class="text-center mb-4">Expense Tracker</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form onsubmit="formHandler(event)" class="row g-3">
                    <div class="col-md-4">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" name="amount" id="amount" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="desc" class="form-label">Description</label>
                        <input type="text" name="desc" id="desc" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="category" class="form-label">Category</label>
                        <select name="category" id="category" class="form-select">
                            <option value="food">Food</option>
                            <option value="repairs">Repairs</option>
                            <option value="groceries">Groceries</option>
                            <option value="travel">Travel</option>
                            <option value="electricity">Electricity</option>
                            <option value="fuel">Fuel</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                    </div>
                </form>
            </div>
        </div>

        <ul id="expenseList" class="list-group shadow-sm"></ul>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.21.1/axios.min.js"></script>
    <script src="expenseData.js"></script>
</body>
</html>
